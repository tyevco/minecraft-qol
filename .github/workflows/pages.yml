name: Pages

# Publishes the model viewer and the T-pose sheets (dist/viewer) on every push
# to main. The page shows exactly what the repo generates, so a texture or
# geometry change is visible without a game. One-time setup: Settings -> Pages
# -> Source: "GitHub Actions".
#
# `npm run pages` is `npm run viewer` then `npm run sheets`, in that order: the
# viewer build clears dist/viewer, and the sheets are written inside it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
